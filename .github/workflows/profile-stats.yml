name: Update profile stats

on:
  push:
  pull_request:
    types: [closed]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get commit count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMITS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/search/commits?q=author:robin-maurya" \
            -H "Accept: application/vnd.github.cloak-preview" | jq '.total_count')

          echo "COMMITS=$COMMITS" >> "$GITHUB_ENV"

      - name: Update README
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()

          commits = os.environ.get("COMMITS", "0")

          block = f'''<!-- PROFILE_STATS_START -->
<p align="center">
  <img src="https://img.shields.io/badge/Commits-{commits}-blue?style=for-the-badge&logo=github" alt="Total Commits" />
</p>
<!-- PROFILE_STATS_END -->'''

          start = text.find("<!-- PROFILE_STATS_START -->")
          end = text.find("<!-- PROFILE_STATS_END -->")

          if start != -1 and end != -1:
              text = text[:start] + block + text[end + len("<!-- PROFILE_STATS_END -->"):]
          else:
              text += "\n" + block

          readme.write_text(text)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update commit badge"
          git push
