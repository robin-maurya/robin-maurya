name: Update profile stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get total commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          url = "https://api.github.com/search/commits?q=author:robin-maurya"
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github.cloak-preview"
              }
          )

          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode())

          total = data.get("total_count", 0)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"COMMITS={total}\n")
          PY

      - name: Update README
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()

          commits = os.environ.get("COMMITS", "0")

          block = f'''<!-- PROFILE_STATS_START -->
<p align="center">
  <img src="https://img.shields.io/badge/Commits-{commits}-blue?style=for-the-badge&logo=github" alt="Total Commits" />
</p>
<!-- PROFILE_STATS_END -->'''

          start = text.find("<!-- PROFILE_STATS_START -->")
          end = text.find("<!-- PROFILE_STATS_END -->")

          if start != -1 and end != -1:
              text = text[:start] + block + text[end + len("<!-- PROFILE_STATS_END -->"):]
          else:
              text += "\n" + block

          readme.write_text(text)
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update profile stats"
          git push
